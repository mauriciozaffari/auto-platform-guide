inherit_gem:
  rails-quality-assurance: rubocop.yml

# The gem supports older Rubies than the host app it was extracted from.
AllCops:
  TargetRubyVersion: 3.2

Naming/FileName:
  Exclude:
    - 'lib/auto-platform-guide.rb'

# AutoPlatformGuide::Generator is a CLI tool, not a Rails service object: writing to
# stdout and exiting are its interface, and its TOC/README rendering is one
# cohesive unit split by helpers.
Rails/Output:
  Exclude:
    - 'lib/auto_platform_guide/generator.rb'
Rails/Exit:
  Exclude:
    - 'lib/auto_platform_guide/generator.rb'
Metrics/ClassLength:
  Exclude:
    - 'lib/auto_platform_guide/generator.rb'
Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/auto_platform_guide/generator.rb'
