---
exclude_paths:
  - config
  - db
  - spec
  - vendor

detectors:
  Attribute:
    exclude:
      # Configuration is a settings bag; writers are its interface.
      - 'AutoPlatformGuide::Configuration'
  TooManyInstanceVariables:
    exclude:
      # Five settings on the configuration object, not scattered state.
      - 'AutoPlatformGuide::Configuration'
  NestedIterators:
    exclude:
      # Depth-two iteration over specs/comments/screenshots is the generator's job.
      - 'generate_readme'
      - 'render_doc_body'
      - 'toc_groups'
      - 'attach_browser_logging'
  IrresponsibleModule:
    enabled: false
  UtilityFunction:
    enabled: false
  ControlParameter:
    enabled: false
  BooleanParameter:
    enabled: false
  FeatureEnvy:
    enabled: false
  TooManyStatements:
    enabled: false
  DuplicateMethodCall:
    enabled: false
  LongParameterList:
    enabled: false
  RepeatedConditional:
    enabled: false
  DataClump:
    enabled: false
  ManualDispatch:
    enabled: false
  MissingSafeMethod:
    enabled: false
  NilCheck:
    enabled: false
  UncommunicativeVariableName:
    enabled: false
  TooManyMethods:
    max_methods: 25